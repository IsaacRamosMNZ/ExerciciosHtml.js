<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Aleatórias</title>
    <style>
body {
      background: linear-gradient(135deg, #2980b9, #8e44ad);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      flex-direction: column;
      text-align: center;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      width: 300px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    input[type="number"], input[type="text"] {
      width: 80%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    button {
      width: 80%;
      padding: 10px;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      background-color: #8e44ad;
      color: white;
      border: none;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #732d91;
    }

    .senha-gerada {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #e0f7fa;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercício 13: Gerador de Senhas Aleatórias</h1>
        <input type="number" id="tamanho" class="input" placeholder="Tamanho da senha" min="4">
        <button onclick="gerarSenha()" class="btn">Gerar Senha</button>
        <div id="resultado" class="resultado"></div>
        <br>
          <button class="voltar" onclick="window.location.href = 'index.html';">Voltar para o Início</button>
      </div>
      
      <script>
        function gerarSenha() {
          let tamanho = parseInt(document.getElementById("tamanho").value);
          if (isNaN(tamanho) || tamanho < 4) {
            document.getElementById("resultado").innerText = "A senha precisa ter pelo menos 4 caracteres.";
            return;
          }
      
          const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
          let senha = "";
          for (let i = 0; i < tamanho; i++) {
            senha += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
          }
      
          document.getElementById("resultado").innerText = "Senha gerada: " + senha;
        }
 
    </script>
</body>
</html>
